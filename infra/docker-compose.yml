version: '3.8'

services:

  # 1. Cơ sở dữ liệu quan hệ (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: gem_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - gem_postgres_data:/var/lib/postgresql/data
    networks:
      - gem_network

  # 2. Cơ sở dữ liệu Vector (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: gem_qdrant
    restart: always
    ports:
      - "${QDRANT_PORT}:6333"
      - "6334:6334"
    volumes:
      - gem_qdrant_storage:/qdrant/storage
    networks:
      - gem_network

  # 3. Trình duyệt ảo chống Bot (Browserless/Chrome)
  # 3. Máy chủ chuyên giải mã Cloudflare (FlareSolverr)
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: gem_flaresolverr
    restart: always
    environment:
      - LOG_LEVEL=info
    ports:
      - "8191:8191"
    networks:
      - gem_network

  # 4. Giao diện quản trị Airflow
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gem_airflow_webserver
    restart: always
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__SECRET_KEY=thu_khoa_bao_mat_cua_gem
      - CLOUD_DB_URL=${CLOUD_DB_URL}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PYTHONPATH=/opt/airflow/pipeline/src
    volumes:
      - ../pipeline/dags:/opt/airflow/dags
      - ../pipeline/src:/opt/airflow/pipeline/src
    networks:
      - gem_network
    command: webserver

  # 5. Trình lên lịch Airflow Scheduler
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gem_airflow_scheduler
    restart: always
    depends_on:
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__SECRET_KEY=thu_khoa_bao_mat_cua_gem
      - CLOUD_DB_URL=${CLOUD_DB_URL}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PYTHONPATH=/opt/airflow/pipeline/src
    volumes:
      - ../pipeline/dags:/opt/airflow/dags
      - ../pipeline/src:/opt/airflow/pipeline/src
    networks:
      - gem_network
    command: scheduler

volumes:
  gem_postgres_data:
  gem_qdrant_storage:

networks:
  gem_network:
    driver: bridge